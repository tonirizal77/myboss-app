name: myboss_app
description: "Starter template - full clean-architecture copy of hayo_app's core_feat/features, for scaffolding new apps. Business content (copy, assets, endpoints) is hayo_app's own as placeholder dummy data - replace per project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2 #">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # `hayo_core` branch - gives this template hayo_app's actual theme
  # tokens (colors/fonts) so it looks identical out of the box. Once this
  # becomes a real project with its own brand, fork your own
  # `<app>_core` branch off `main` the same way hayo_app forked
  # `hayo_core` (see mobile_app_core's README / hayo_app's CLAUDE.md).
  mobile_app_core:
    git:
      url: https://github.com/Olsera/mobile_app_core.git
      ref: mybos-core

  cupertino_icons: ^1.0.8

  # installed
  # ---------
  another_flushbar: ^1.12.32
  animated_toggle_switch: ^0.8.5
  barcode_widget: ^2.0.4
  bloc_concurrency: ^0.3.0
  connectivity_plus: ^7.1.0
  cached_network_image: ^3.4.1
  cached_video_player_plus: ^4.1.0
  collection: ^1.19.1
  dartz: ^0.10.1
  dio: ^5.9.1
  dio_smart_retry: ^7.0.1
  easy_localization: ^3.0.8
  envied: ^1.3.2
  flutter_bloc: ^9.1.1
  flutter_map: ^8.2.2
  flutter_map_animations: ^0.9.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.4
  flutter_local_notifications: ^19.5.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.2
  get_it: ^9.2.0
  go_router: ^17.1.0
  hydrated_bloc: ^11.0.0
  intl: ^0.20.2
  intl_mobile_field: ^2.1.4
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  logger: ^2.5.0
  marionette_flutter: ^0.3.0
  native_device_orientation: ^2.1.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  pointycastle: ^4.0.0
  share_plus: ^11.0.0
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  solar_icons: ^0.1.0
  tuple: ^2.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  lottie: ^3.3.2
  screen_protector: ^1.5.3
  socket_io_client: ^3.1.4
  flutter_html: ^3.0.0

dependency_overrides:
  html: 0.15.4
#   mobile_app_core:
#     path: ../mobile_app_core

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # installed
  # ---------
  build_runner: ^2.10.5
  envied_generator: ^1.3.2
  freezed: ^3.2.4
  json_serializable: ^6.12.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # hayo_app's own assets, copied wholesale as placeholder/dummy content -
  # swap per project (brand images/icons/svg, translation copy) once this
  # becomes a real app. See README.md.
  assets:
    - assets/flags/
    - assets/fonts/Lato/
    - assets/fonts/Onest/
    - assets/fonts/Onest/static/
    - assets/fonts/Poppins/
    - assets/gif/
    - assets/icons/
    - assets/images/
    - assets/svg/
    - assets/translations/

  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest/static/Onest-Black.ttf
        - asset: assets/fonts/Onest/static/Onest-Bold.ttf
        - asset: assets/fonts/Onest/static/Onest-ExtraBold.ttf
        - asset: assets/fonts/Onest/static/Onest-ExtraLight.ttf
        - asset: assets/fonts/Onest/static/Onest-Light.ttf
        - asset: assets/fonts/Onest/static/Onest-Medium.ttf
        - asset: assets/fonts/Onest/static/Onest-Regular.ttf
        - asset: assets/fonts/Onest/static/Onest-SemiBold.ttf
        - asset: assets/fonts/Onest/static/Onest-Thin.ttf
